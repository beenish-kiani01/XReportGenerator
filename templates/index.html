<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>X Report Generator</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="header">

            <h1>X Report Generator</h1>

            <p>
                Generate automated reports from X posts
            </p>

        </div>


        <div class="card">

            <label for="query">
                Keyword or Hashtag
            </label>

            <input
                type="text"
                id="query"
                placeholder="Example: AI or #AI"
            >


            <div id="numberSection">

                <label for="numberOfPosts">
                    Number of Posts
                </label>

                <input
                    type="number"
                    id="numberOfPosts"
                    value="10"
                    min="1"
                    max="100"
                >

            </div>


            <button
                id="generateButton"
                onclick="generateReport()"
            >
                Generate Report
            </button>


            <div id="status"></div>


            <div id="downloadSection"
                 class="hidden">

                <a
                    id="downloadButton"
                    class="download-button"
                    href="#"
                >

                    Download Word Report

                </a>

            </div>

        </div>

    </div>


    <script src="{{ url_for('static', filename='script.js') }}">
    </script>

</body>

</html>
